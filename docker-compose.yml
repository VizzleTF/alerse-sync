# Self-hosted Arcomium sync: the server and its Postgres.
#
#   POSTGRES_PASSWORD=change-me docker compose up -d
#
# Then set Arcomium's sync server to http://<this host>:8295/v2.
services:
  sync:
    image: ghcr.io/vizzletf/arcomium-sync:latest
    build: .
    restart: unless-stopped
    ports:
      - "8295:8295"
    environment:
      DATABASE_URL: postgres://arcomium:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/arcomium?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcomium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: arcomium
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcomium -d arcomium"]
      interval: 5s
      retries: 10

volumes:
  postgres:
